[workspace]
resolver = "3"
members = ["crates/wd_core", "crates/wd_device", "crates/wd_diag", "crates/wd_setup"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
