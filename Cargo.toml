[workspace]
resolver = "3"
members = ["crates/wd_core", "crates/wd_device", "crates/wd_diag", "crates/wd_setup", "crates/wd_game"]

[workspace.package]
version = "0.27.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
