[package]
name = "wd_game"
description = "Game plugin: wheel input through the game's gamepad polls, with no motor output"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
red4ext-rs = { git = "https://github.com/jac3km4/red4ext-rs", rev = "1ea91e760c0626245449f21e184e9f860b943c48" }
wd_core = { path = "../wd_core" }
wd_device = { path = "../wd_device" }

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_XboxController",
]

[lints]
workspace = true
